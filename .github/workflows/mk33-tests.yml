name: Mk33 tests

on:
  workflow_dispatch:
  push:
    paths: ["src/mk33/**", "tests/mk33/**", "configs/mk33/**", "scripts/mk33/**", "pyproject.toml", ".github/workflows/mk33-tests.yml"]
  pull_request:
    paths: ["src/mk33/**", "tests/mk33/**", "configs/mk33/**", "scripts/mk33/**", "pyproject.toml", ".github/workflows/mk33-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev,langgraph]'
      - run: python -m pytest tests/mk33 -q

  other-os:
    # The agent sandbox, scorer and benchmark on Windows (Git Bash) and macOS.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,langgraph]"
      - run: python -m pytest tests/mk33 -q

  kv:
    # KV-cache compression and the Triton kernels, on CPU: a tiny random model (no
    # downloads) and Triton's interpreter instead of a GPU.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[dev]' 'transformers>=4.46' triton peft accelerate
      - run: python -m pytest tests/mk33/test_kv.py tests/mk33/test_bench_memory.py -q
      - run: python -m pytest tests/mk33/test_sft.py tests/mk33/test_train_smoke.py -q  # LoRA training end to end
      - run: python -m pytest tests/mk33/test_kv_triton.py -q
        env:
          TRITON_INTERPRET: "1"
