# Mk33 default configuration (paper Sections 3.1-3.4).
# Values marked "proposed" are reasoned defaults, not tuned results.
# Ablation configs in ablations/ inherit this file and override only what they change.
name: default
description: Full Mk33 method.

filter:                 # 3.1 noise-aware headroom filter
  sigma_k: 3.0          # gap >= 3 sigma of reference runs
  rel_margin: 0.05      # gap >= 5% of |reference|
  min_reference_runs: 3
  judge_max_baseline: 0.6
  judge_min_reference: 0.95

decontam:               # 3.1 decontamination against eval benchmarks
  enabled: true
  n: 13
  threshold: 0.5

audit:                  # 3.1 process audit
  literal_min_len: 32
  literal_short_len: 8
  literal_short_count: 3
  canary_gap: 0.2

tools:                  # 3.2 fixed tool set
  bash_timeout_s: 600
  max_output_tokens: 8000
  max_wait_s: 1800

rlc:                    # 3.2 Round Ledger Compaction (inference and collection)
  mode: rlc
  window: 128000
  theta: 0.75
  keep_rounds: 2
  ledger_cap: 16000

budget:                 # 3.2 / 3.4 rollout budgets per domain
  ml:     {max_tool_calls: 400, max_wall_s: 43200}   # 12 h
  judge:  {max_tool_calls: 400, max_wall_s: 18000}   # 5 h

selection:              # 3.4 acceptance rule
  tau: {ml: 0.9, judge: 0.95}
  min_rounds: 3
  require_iteration: true
  max_per_env: 2

palm:                   # 3.3 Progress-Aware Loss Masking
  mode: palm
  lam: 0.5              # proposed; swept in A1
  window: 20
  jaccard: 0.9
  m_rounds: 3
  evidence_window: 50
  ngram: 8

sft:                    # 3.4 training hyperparameters (proposed)
  model: Qwen/Qwen3.8-27B
  train_files: [data/mk33/windows.jsonl, data/mk33/arex_research.jsonl]
  output_dir: checkpoints/mk33-default
  max_len: 131072
  learning_rate: 1.0e-5
  min_lr_ratio: 0.1
  warmup_ratio: 0.03
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  epochs: 2
  global_batch: 64
  micro_batch: 1
  max_grad_norm: 1.0
  bf16: true
  deepspeed: configs/mk33/deepspeed_zero3.json
  seed: 0
